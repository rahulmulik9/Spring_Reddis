spring:
  application:
    name: task-manager

  server:
    port: 8080

  datasource:
    url: jdbc:postgresql://localhost:5433/taskmanagerdb
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always