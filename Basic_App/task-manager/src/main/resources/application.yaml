spring:
  application:
    name: task-manager

  datasource:
    url: jdbc:postgresql://localhost:5433/taskmanagerdb
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always